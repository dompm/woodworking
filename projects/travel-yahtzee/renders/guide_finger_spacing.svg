<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Finger-joint jig: what gets adjusted"><rect width="1000" height="520" fill="#faf8f3"/><style>text{font-family:Arial,sans-serif;font-size:19px;fill:#263a3b}.title{font-size:27px;font-weight:bold}.small{font-size:16px}.wood{fill:#dfc7a1;stroke:#69543c;stroke-width:2}.metal{fill:#bfd7dc;stroke:#315d6a;stroke-width:2}.line{fill:none;stroke:#476368;stroke-width:1.6}.dim{fill:none;stroke:#476368;stroke-width:1.6;marker-start:url(#tick);marker-end:url(#tick)}</style><defs><marker id="tick" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M5 0V10" stroke="#476368" stroke-width="1.5"/></marker></defs><text x="36" y="46" class="title">Finger-joint jig: what gets adjusted</text>
<text x="65" y="91" class="small">Top view of spacing only — complete sled, clamps and guard are omitted here.</text>
